---
- name: Listar VMs Linux ligadas a partir do inventário do AWX
  hosts: all
  gather_facts: false
  become: false

  pre_tasks:
    - name: Validar a política definida no inventário do AWX
      ansible.builtin.assert:
        that:
          - vm_inventory_policy is defined
          - vm_inventory_policy.powered_on_group is defined
          - vm_inventory_policy.linux_groups is defined
          - vm_inventory_policy.linux_groups | length > 0
        fail_msg: >-
          Configure vm_inventory_policy nas variáveis do inventário do AWX.
      run_once: true
      delegate_to: localhost

  tasks:
    - name: Inicializar a lista de VMs selecionadas
      ansible.builtin.set_fact:
        selected_vms: []
      run_once: true
      delegate_to: localhost

    - name: Selecionar VMs ligadas pertencentes a grupos Linux
      ansible.builtin.set_fact:
        selected_vms: "{{ selected_vms + [vm_record] }}"
      vars:
        vm_data: "{{ hostvars[item] }}"
        vm_groups: "{{ vm_data.group_names | default([]) }}"
        vm_ip: >-
          {{
            vm_data['guest.ipAddress'] |
            default(vm_data.ansible_host | default(''))
          }}
        vm_record:
          inventory_hostname: "{{ item }}"
          vm_name: "{{ vm_data['config.name'] | default('') }}"
          hostname: "{{ vm_data['guest.hostName'] | default('') }}"
          ip: "{{ vm_ip }}"
          guest_id: >-
            {{
              vm_data['guest.guestId'] |
              default(vm_data['config.guestId'] | default(''))
            }}
          instance_uuid: >-
            {{ vm_data['config.instanceUuid'] | default('') }}
          linux_groups: >-
            {{ vm_groups | intersect(vm_inventory_policy.linux_groups) }}
      loop: "{{ ansible_play_hosts_all }}"
      when:
        - vm_inventory_policy.powered_on_group in vm_groups
        - vm_groups | intersect(vm_inventory_policy.linux_groups) | length > 0
        - >-
          not (vm_inventory_policy.exclude_templates | default(true) | bool)
          or not (vm_data['config.template'] | default(false) | bool)
        - >-
          not (vm_inventory_policy.require_ip | default(true) | bool)
          or vm_ip | length > 0
      run_once: true
      delegate_to: localhost
      loop_control:
        label: "{{ item }}"

    - name: Publicar a listagem como artefato do job
      ansible.builtin.set_stats:
        data:
          selected_vm_count: "{{ selected_vms | length }}"
          selected_vms: "{{ selected_vms }}"
        per_host: false
      run_once: true
      delegate_to: localhost

    - name: Exibir somente o total no log
      ansible.builtin.debug:
        msg: "VMs Linux ligadas encontradas: {{ selected_vms | length }}"
      run_once: true
      delegate_to: localhost