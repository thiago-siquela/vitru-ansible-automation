---
name: Format Code

on:
  push:
    branches:
      - execution
      - develop

  pull_request:
    branches:
      - execution
      - develop

jobs:
  build:
    name: Ansible lint and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Check YAML
        run: yamllint .

      - name: Check Ansible
        run: ansible-lint

      - name: Check formatting
        run: |
          ansible-lint --fix
          git diff --exit-code